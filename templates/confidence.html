<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Need Confidence? - SeeMe in STEM</title>
    <style>
        :root {
            --bg: #F7F0EA;
            --card: #FEFDFC;
            --text: #6E667B;
            --primary: #786F85;
            --border: #BBB8C2;
            --gold: #786F85;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            color: var(--text);
        }

        .navbar {
            background: var(--card);
            padding: 1rem 2rem;
            box-shadow: 0 2px 15px rgba(110, 102, 123, 0.1);
            border-bottom: 3px solid var(--border);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, var(--primary) 0%, var(--gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo-icon { width: 40px; height: 40px; }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text);
            font-weight: 500;
            transition: all 0.3s;
        }

        .nav-links a:hover { color: var(--primary); }

        .confidence-check-section {
            max-width: 1200px;
            margin: 4rem auto;
            padding: 3rem 2rem;
            background: #F7F0EA;
            border-radius: 40px;
            box-shadow: 0 15px 60px rgba(74, 74, 74, 0.15);
            border: 5px solid #857A8D;
        }

        .confidence-check-section h2 {
            text-align: center;
            background: linear-gradient(135deg, #786F85 0%, #857A8D 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
            font-size: 2.5rem;
        }

        .section-subtitle {
            text-align: center;
            color: #6B5B4B;
            font-size: 1.2rem;
            margin-bottom: 2.5rem;
        }

        .concerns-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .concern-card {
            background: #F7F0EA;
            border: 4px solid #786F85;
            border-radius: 25px;
            padding: 2rem 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .concern-card:hover {
            transform: translateY(-8px);
            border-color: #786F85;
            box-shadow: 0 12px 35px rgba(159, 161, 255, 0.4), 0 0 20px #786F85;
        }

        .concern-icon {
            font-size: 3rem;
        }

        .concern-text {
            color: #6E667B;
            font-size: 1.05rem;
            font-weight: 600;
            line-height: 1.4;
        }

        .confidence-response {
            background: #F7F0EA;
            border-radius: 25px;
            padding: 2.5rem;
            margin-top: 2rem;
            box-shadow: 0 8px 30px rgba(74, 74, 74, 0.15);
            animation: slideIn 0.5s ease-out;
            border: 3px solid #C3BBC5;
            display: none;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .response-content {
            color: #6E667B;
            font-size: 1.15rem;
            line-height: 1.8;
        }

        .response-content h3 {
            color: #6E667B;
            margin-bottom: 1rem;
            font-size: 1.8rem;
        }

        .response-content p {
            margin-bottom: 1rem;
            color: #6B5B4B;
        }

        .response-content ul {
            margin-left: 1.5rem;
            line-height: 1.8;
        }

        .response-content strong {
            color: #6E667B;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <img src="/static/icon.svg" alt="SeeMe STEM Logo" class="logo-icon">
                SeeMe in STEM
            </div>
            <ul class="nav-links">
                <li><a href="/">Home</a></li>
                <li><a href="/careers">Careers</a></li>
                <li><a href="/role-models">Role Models</a></li>
                <li><a href="/opportunities">Resources</a></li>
                <li><a href="/confidence">Support</a></li>
                <li><a href="/quiz">Take Quiz</a></li>
            </ul>
        </div>
    </nav>

    <div class="confidence-check-section">
        <h2>💭 Feeling Unsure About STEM?</h2>
        <p class="section-subtitle">You're not alone! Pick what's on your mind, and let's talk about it.</p>

        <div class="concerns-grid">
            <button class="concern-card" onclick="showConfidenceResponse('start')">
                <div class="concern-icon">🤔</div>
                <div class="concern-text">I don't know where to start</div>
            </button>

            <button class="concern-card" onclick="showConfidenceResponse('math')">
                <div class="concern-icon">🧮</div>
                <div class="concern-text">I'm bad at math</div>
            </button>

            <button class="concern-card" onclick="showConfidenceResponse('network')">
                <div class="concern-icon">👥</div>
                <div class="concern-text">I don't know anyone in STEM</div>
            </button>

            <button class="concern-card" onclick="showConfidenceResponse('smart')">
                <div class="concern-icon">🧠</div>
                <div class="concern-text">I'm scared I'm not smart enough</div>
            </button>

            <button class="concern-card" onclick="showConfidenceResponse('impact')">
                <div class="concern-icon">❤️</div>
                <div class="concern-text">I want a career that helps people</div>
            </button>
        </div>

        <div class="confidence-response" id="confidenceResponse">
            <div class="response-content" id="responseContent"></div>
        </div>
    </div>

    <script>
        function showConfidenceResponse(concern) {
            const responseDiv = document.getElementById('confidenceResponse');
            const contentDiv = document.getElementById('responseContent');

            const responses = {
                start: `
                    <h3>You're Already On the Right Track! 🌟</h3>
                    <p><strong>Starting is the hardest part, and you're here!</strong> That takes courage.</p>
                    <p>Here's the secret: <strong>nobody has it all figured out at first</strong>. Every scientist, engineer, and tech professional you admire started exactly where you are — curious but unsure.</p>
                    <p><strong>Your next steps:</strong></p>
                    <ul>
                        <li>Take our quick quiz to find careers that match your interests</li>
                        <li>Explore beginner-friendly projects (no experience needed!)</li>
                        <li>Connect with role models who started just like you</li>
                        <li>Join a STEM club or online community where you can learn together</li>
                    </ul>
                    <p style="margin-top: 1rem;"><strong>Remember:</strong> Every expert was once a beginner. Your journey starts with one small step! 💪</p>
                `,
                math: `
                    <h3>Math is a Skill, Not a Talent! 🧮✨</h3>
                    <p><strong>Here's the truth:</strong> Being "bad at math" doesn't exist. You just haven't found the right way to learn it yet!</p>
                    <p>Many successful STEM professionals struggled with math at first. The difference? <strong>They kept going</strong>, and they found learning methods that worked for them.</p>
                    <p><strong>What actually matters in STEM:</strong></p>
                    <ul>
                        <li><strong>Curiosity</strong> — wanting to understand how things work</li>
                        <li><strong>Problem-solving</strong> — breaking big problems into smaller pieces</li>
                        <li><strong>Creativity</strong> — thinking of new ways to solve challenges</li>
                        <li><strong>Persistence</strong> — not giving up when things get tough</li>
                    </ul>
                    <p style="margin-top: 1rem;"><strong>Plus:</strong> Many STEM careers use basic math, not complex calculus. Tools and computers do the heavy lifting — you provide the creativity and thinking! 🎨🤖</p>
                `,
                network: `
                    <h3>You're Building Your Network Right Now! 👥💫</h3>
                    <p><strong>Not knowing anyone in STEM is actually super common</strong> — and it's totally okay! Most STEM professionals didn't grow up with connections either.</p>
                    <p><strong>The good news:</strong> The STEM community is full of people who want to help newcomers succeed. They remember when they were in your shoes!</p>
                    <p><strong>Ways to start building your STEM network:</strong></p>
                    <ul>
                        <li><strong>Connect with our role models</strong> — real people who want to mentor students like you</li>
                        <li><strong>Join online communities</strong> — Discord servers, Reddit forums, student groups</li>
                        <li><strong>Attend STEM events</strong> — hackathons, science fairs, club meetings</li>
                        <li><strong>Reach out to professionals</strong> — many are happy to answer questions or do virtual coffee chats</li>
                        <li><strong>Shadow programs</strong> — spend a day seeing what a STEM career looks like</li>
                    </ul>
                    <p style="margin-top: 1rem;"><strong>Remember:</strong> Every connection starts with a simple "hello." You've got this! 🚀</p>
                `,
                smart: `
                    <h3>Stop Right There! You ARE Smart Enough! 🧠✨</h3>
                    <p><strong>Let's get this straight:</strong> STEM isn't about being "smart" — it's about being <strong>curious, determined, and willing to learn</strong>.</p>
                    <p><strong>The "genius myth" is totally false.</strong> Most people in STEM aren't child prodigies — they're regular people who worked hard and didn't give up.</p>
                    <p><strong>What STEM really needs:</strong></p>
                    <ul>
                        <li><strong>People who ask questions</strong> — "why" and "how" are powerful</li>
                        <li><strong>People who try things</strong> — even if they fail at first</li>
                        <li><strong>People with different perspectives</strong> — YOUR unique viewpoint matters!</li>
                        <li><strong>People who care about solving problems</strong> — passion beats "natural talent"</li>
                    </ul>
                    <p style="margin-top: 1rem;"><strong>Fun fact:</strong> Many famous scientists and engineers did poorly in school! Albert Einstein struggled with traditional education. Steve Jobs never finished college. What they had was <strong>passion and persistence</strong> — and so do you! 🌟</p>
                    <p><strong>You belong in STEM. Period.</strong> 💪</p>
                `,
                impact: `
                    <h3>STEM is ALL About Helping People! ❤️🌍</h3>
                    <p><strong>If you want to make a difference, STEM is the perfect path!</strong> Every single STEM field exists to solve problems and improve lives.</p>
                    <p><strong>How STEM careers help people:</strong></p>
                    <ul>
                        <li><strong>Biomedical Engineers</strong> — design prosthetics, medical devices, and life-saving technologies</li>
                        <li><strong>Software Engineers</strong> — create apps for education, healthcare, accessibility, and connection</li>
                        <li><strong>Environmental Scientists</strong> — protect our planet and fight climate change</li>
                        <li><strong>Cybersecurity Analysts</strong> — protect people's data and privacy</li>
                        <li><strong>Data Scientists</strong> — analyze information to improve healthcare, education, and social services</li>
                        <li><strong>Aerospace Engineers</strong> — advance space exploration and develop technologies that save lives</li>
                    </ul>
                    <p style="margin-top: 1rem;"><strong>The best part?</strong> STEM gives you the tools to create solutions for problems you care about. Want to help your community? Build healthcare access? Protect the environment? <strong>STEM is how you do it!</strong> 🚀</p>
                    <p><strong>Your compassion + STEM skills = World-changing impact!</strong> 💫</p>
                `
            };

            contentDiv.innerHTML = responses[concern];
            responseDiv.style.display = 'block';
            responseDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
    </script>
</body>
</html>
